
name: Flask Application CI

on:
  push:
    branches:
      - main
      - feature/github-actions-day1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 04-docker-compose/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q 04-docker-compose/app

      - name: Build Docker image
        run: |
          docker build -t flask-compose-app ./04-docker-compose
